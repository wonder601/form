<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人事評価フォーム</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      /* ★背景色を #0097E0 に変更 */
      background-color: #0097E0;
      color: #0f172a;
      margin: 0;
      padding: 40px 20px;
      line-height: 1.5;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 32px;
      /* 少し深めのシャドウで背景との境界をクッキリ配置 */
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }
    
    /* ヘッダー（左右横並びレイアウト） */
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 16px;
      margin-bottom: 32px;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0;
      flex: 1;
      color: #0f172a;
    }
    .header-logo {
      max-height: 50px;
      max-width: 160px;
      height: auto;
      object-fit: contain;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 12px;
      }
      .container {
        padding: 24px 16px;
      }
      .header-container {
        flex-direction: column-reverse;
        align-items: flex-start;
      }
      .header-logo {
        max-height: 40px;
      }
    }

    /* 質問ごとの間隔 */
    .form-group { margin-bottom: 36px; }

    label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 0.95rem; }
    .required { color: #ef4444; margin-left: 4px; }

    /* 補足説明文 */
    .description { font-size: 0.78rem; color: #64748b; margin-bottom: 8px; line-height: 1.5; }

    input[type="text"], textarea, select {
      width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;
      box-sizing: border-box; font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    /* 入力欄にフォーカスした際のハイライトカラーも #0097E0 に同調 */
    input[type="text"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #0097E0;
      box-shadow: 0 0 0 3px rgba(0, 151, 224, 0.2);
    }
    textarea { min-height: 100px; resize: vertical; }
    
    .option-group { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
    .option-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: normal; }
    .option-label input {
      cursor: pointer;
      accent-color: #0097E0; /* チェックボックス/ラジオボタンのアクセントカラー */
    }

    /* ★送信ボタンのデザインを #0097E0 に変更 */
    .btn-submit {
      width: 100%; background: #0097E0; color: white; border: none; padding: 14px;
      border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 16px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-submit:hover { background: #0081C0; }
    .btn-submit:active { transform: scale(0.99); }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }

    #message { margin-top: 20px; padding: 12px; border-radius: 6px; text-align: center; font-weight: bold; display: none; }
    .msg-success { background: #dcfce7; color: #166534; }
    .msg-error { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-container">
    <h1 id="form-title">フォーム読み込み中...</h1>
    <img id="form-logo" class="header-logo" src="" alt="ロゴ" style="display: none;">
  </div>

  <form id="eval-form" style="display: none;">
    <div id="form-fields"></div>
    <button type="submit" class="btn-submit" id="submit-btn">送信する</button>
  </form>
  <div id="message"></div>
</div>

<script>
  // ★ご自身のGAS WebアプリURLを設定してください
  const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwWtoVhaTj4X7HTQKYdg1ITaiiilJEVnjNdVjjTE1DaIjEyM2iOQQdPKnTUzZxvuVwI/exec';

  // ★表示したいロゴ画像のファイル名を指定します（例: 'logo.jpg'）
  const LOGO_IMAGE_URL = 'Group 368 (1).jpg';

  const urlParams = new URLSearchParams(window.location.search);
  const csvFileName = urlParams.get('form') || 'evaluation_18.csv';
  const currentSheetName = csvFileName.replace('.csv', '');

  document.addEventListener('DOMContentLoaded', () => {
    setupLogo();
    loadFormDefinition();
  });

  function setupLogo() {
    if (LOGO_IMAGE_URL) {
      const logoImg = document.getElementById('form-logo');
      logoImg.src = LOGO_IMAGE_URL;
      logoImg.style.display = 'block';
      
      logoImg.onerror = () => {
        logoImg.style.display = 'none';
      };
    }
  }

  function loadFormDefinition() {
    Papa.parse(csvFileName, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: (results) => {
        renderForm(results.data);
      },
      error: () => {
        document.getElementById('form-title').textContent = '指定されたフォームが見つかりません。';
      }
    });
  }

  function formatText(text) {
    if (!text) return '';
    return text.replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
  }

  function renderForm(data) {
    const fieldsContainer = document.getElementById('form-fields');
    fieldsContainer.innerHTML = '';

    data.forEach(item => {
      if (!item.type) return;

      if (item.type === 'header') {
        document.getElementById('form-title').innerHTML = formatText(item.label);
        return;
      }
      if (item.type === 'config') return;

      const group = document.createElement('div');
      group.className = 'form-group';

      const label = document.createElement('label');
      label.innerHTML = formatText(item.label);
      if (item.required === 'true') {
        const req = document.createElement('span');
        req.className = 'required';
        req.textContent = '*';
        label.appendChild(req);
      }
      group.appendChild(label);

      if (item.description) {
        const desc = document.createElement('div');
        desc.className = 'description';
        desc.innerHTML = formatText(item.description);
        group.appendChild(desc);
      }

      // テキスト入力
      if (item.type === 'text') {
        const input = document.createElement('input');
        input.type = 'text';
        input.name = item.id;
        input.placeholder = item.placeholder || '';
        if (item.required === 'true') input.required = true;
        group.appendChild(input);
      } 
      // 複数行テキスト
      else if (item.type === 'textarea') {
        const textarea = document.createElement('textarea');
        textarea.name = item.id;
        textarea.placeholder = item.placeholder || '';
        if (item.required === 'true') textarea.required = true;
        group.appendChild(textarea);
      } 
      // 単一選択（ラジオボタン または 評価 rating）
      else if (item.type === 'radio' || item.type === 'rating') {
        const optContainer = document.createElement('div');
        optContainer.className = 'option-group';
        
        const opts = item.options ? item.options.split('|').map(s => s.trim()) : ['1', '2', '3', '4', '5'];
        
        opts.forEach((opt, idx) => {
          const lbl = document.createElement('label');
          lbl.className = 'option-label';
          const isReq = item.required === 'true' && idx === 0 ? 'required' : '';
          lbl.innerHTML = `<input type="radio" name="${item.id}" value="${opt}" ${isReq}> ${formatText(opt)}`;
          optContainer.appendChild(lbl);
        });
        group.appendChild(optContainer);
      }
      // 複数選択（チェックボックス）
      else if (item.type === 'checkbox') {
        const optContainer = document.createElement('div');
        optContainer.className = 'option-group';
        
        const opts = item.options ? item.options.split('|').map(s => s.trim()) : [];
        opts.forEach(opt => {
          const lbl = document.createElement('label');
          lbl.className = 'option-label';
          lbl.innerHTML = `<input type="checkbox" name="${item.id}" value="${opt}"> ${formatText(opt)}`;
          optContainer.appendChild(lbl);
        });
        group.appendChild(optContainer);
      }
      // ドロップダウン選択
      else if (item.type === 'select') {
        const select = document.createElement('select');
        select.name = item.id;
        if (item.required === 'true') select.required = true;

        const defaultOpt = document.createElement('option');
        defaultOpt.value = '';
        defaultOpt.textContent = '選択してください';
        select.appendChild(defaultOpt);

        const opts = item.options ? item.options.split('|').map(s => s.trim()) : [];
        opts.forEach(opt => {
          const option = document.createElement('option');
          option.value = opt;
          option.textContent = opt;
          select.appendChild(option);
        });
        group.appendChild(select);
      }

      fieldsContainer.appendChild(group);
    });

    document.getElementById('eval-form').style.display = 'block';
  }

  // 送信処理
  document.getElementById('eval-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submit-btn');
    const msgEl = document.getElementById('message');
    
    submitBtn.disabled = true;
    submitBtn.textContent = '送信中...';
    msgEl.style.display = 'none';

    const formData = new FormData(e.target);
    const payload = {};

    formData.forEach((value, key) => {
      if (payload[key]) {
        payload[key] = payload[key] + ', ' + value;
      } else {
        payload[key] = value;
      }
    });

    payload.sheetName = currentSheetName;

    try {
      const res = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const result = await res.json();

      if (result.status === 'success') {
        msgEl.textContent = '送信が完了しました。ご協力ありがとうございました！';
        msgEl.className = 'msg-success';
        msgEl.style.display = 'block';
        e.target.reset();
      } else {
        throw new Error(result.message);
      }
    } catch (err) {
      msgEl.textContent = '送信エラーが発生しました。時間を置いて再度お試しください。';
      msgEl.className = 'msg-error';
      msgEl.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '送信する';
    }
  });
</script>

</body>
</html>
