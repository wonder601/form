<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>お問い合わせフォーム</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>

  <h2>お問合せフォーム</h2>

  <!-- YOUR_FORM_ID の部分をFormspree発行のIDに置き換えてください -->
  <form action="https://formspree.io/f/https://formspree.io/f/xqpzqegn" method="POST">
    <div class="form-group">
      <label for="name">お名前</label>
      <input type="text" id="name" name="name" required>
    </div>

    <div class="form-group">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
      <label for="message">ご意見・ご感想</label>
      <textarea id="message" name="message" rows="5" required></textarea>
    </div>

    <button type="submit">送信する</button>
  </form>

</body>
</html>
